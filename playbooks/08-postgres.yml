---
# ============================================================
# 08 - POSTGRESQL (con dati sintetici di test)
# Installa PostgreSQL come StatefulSet con volume sulla
# StorageClass tanzu-sp, poi crea il database "testdb" con
# dati sintetici (clienti e ordini casuali).
# Il seed viene eseguito solo se "testdb" non esiste ancora.
#
# USO: ansible-playbook -i inventory/test.ini playbooks/08-postgres.yml
# ============================================================

- name: PostgreSQL con dati di test
  hosts: server
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:

    - name: Copia il manifest di PostgreSQL sul nodo
      ansible.builtin.template:
        src: ../templates/postgres.yaml.j2
        dest: /tmp/postgres.yaml
        mode: "0644"

    - name: Applica PostgreSQL (namespace, secret, service, statefulset)
      ansible.builtin.command: "{{ kubectl_bin }} apply -f /tmp/postgres.yaml"
      register: pg_apply
      changed_when: "'created' in pg_apply.stdout or 'configured' in pg_apply.stdout"

    - name: Attendi che PostgreSQL sia pronto (al primo run scarica l'immagine)
      ansible.builtin.command: >
        {{ kubectl_bin }} -n postgres rollout status statefulset/postgres --timeout=60s
      register: pg_ready
      changed_when: false
      retries: 10
      delay: 15
      until: pg_ready.rc == 0

    - name: Controlla se il database testdb esiste gia'
      ansible.builtin.command: >
        {{ kubectl_bin }} -n postgres exec postgres-0 -- psql -U postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='testdb'"
      register: testdb_exists
      changed_when: false

    - name: Copia lo script dei dati sintetici sul nodo
      ansible.builtin.template:
        src: ../templates/postgres-seed.sql.j2
        dest: /tmp/postgres-seed.sql
        mode: "0644"
      when: testdb_exists.stdout | trim != "1"

    - name: Crea testdb e carica i dati sintetici
      ansible.builtin.shell: >
        {{ kubectl_bin }} -n postgres exec -i postgres-0 --
        psql -U postgres -v ON_ERROR_STOP=1 -f - < /tmp/postgres-seed.sql
      when: testdb_exists.stdout | trim != "1"
      changed_when: true

    - name: Riepilogo contenuto del database
      ansible.builtin.command: >
        {{ kubectl_bin }} -n postgres exec postgres-0 -- psql -U postgres -d testdb -tAc
        "SELECT 'clienti: ' || count(*) FROM clienti UNION ALL SELECT 'ordini: ' || count(*) FROM ordini"
      register: pg_counts
      changed_when: false

    - name: Mostra il riepilogo
      ansible.builtin.debug:
        msg: |
          PostgreSQL attivo nel namespace "postgres".
          Connessione dal cluster: postgres.postgres.svc.cluster.local:5432
          Utente: postgres / password: variabile postgres_password (group_vars).
          Database di test "testdb": {{ pg_counts.stdout_lines | join(', ') }}
