---
# ============================================================
# 01 - PREREQUISITI OS (RHEL)
# Prepara ogni VM: firewalld off, swap off, NetworkManager per canal.
# ============================================================

- name: Prerequisiti sistema operativo
  hosts: all
  gather_facts: true
  tasks:

    - name: Disabilita firewalld (RKE2 gestisce la rete dei pod da solo)
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      failed_when: false        # se firewalld non e' installato, prosegui

    - name: Disattiva lo swap adesso
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disattiva lo swap anche ai riavvii (commenta le righe swap in fstab)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Fai in modo che NetworkManager non gestisca le interfacce del CNI canal
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/rke2-canal.conf
        content: |
          [keyfile]
          unmanaged-devices=interface-name:cali*;interface-name:flannel*
        owner: root
        group: root
        mode: "0644"
      register: nm_conf

    - name: Ricarica NetworkManager se ho cambiato la configurazione
      ansible.builtin.systemd:
        name: NetworkManager
        state: reloaded
      when: nm_conf.changed
      failed_when: false

    # ---------- Disco dati dedicato ----------
    # RKE2 e kubelet scrivono sempre in /var/lib/rancher e
    # /var/lib/kubelet: cambiare i loro percorsi e' fragile (SELinux),
    # quindi montiamo quelle cartelle in bind dal disco dati. I volumi
    # Longhorn invece usano direttamente {{ data_disk_path }}/longhorn
    # (impostato nel template del chart).
    - name: Prepara il disco dati dedicato
      when: data_disk_path | default('') | length > 0
      block:

        - name: Controlla se il disco dati e' gia' montato
          ansible.builtin.command: mountpoint -q {{ data_disk_path }}
          register: data_mounted
          changed_when: false
          failed_when: false

        - name: Prepara il disco dati se il mount non esiste ancora
          when: data_mounted.rc != 0 and (data_disk_device | default('') | length > 0)
          block:

            - name: Controlla che il disco sia vuoto (niente partizioni o filesystem)
              ansible.builtin.command: wipefs -n {{ data_disk_device }}
              register: disk_sig
              changed_when: false

            - name: Blocca se il disco contiene gia' dati
              ansible.builtin.fail:
                msg: >-
                  {{ data_disk_device }} contiene gia' partizioni o un
                  filesystem: non lo formatto. Pulisci il disco a mano
                  (wipefs -a) o monta tu {{ data_disk_path }} e rilancia.
              when: disk_sig.stdout | length > 0

            - name: Crea il filesystem XFS sul disco dati
              ansible.builtin.command: mkfs.xfs {{ data_disk_device }}

            - name: Leggi l'UUID del filesystem appena creato
              ansible.builtin.command: blkid -s UUID -o value {{ data_disk_device }}
              register: data_uuid
              changed_when: false

            - name: Monta il disco dati (persistente in fstab, via UUID)
              ansible.posix.mount:
                path: "{{ data_disk_path }}"
                src: "UUID={{ data_uuid.stdout }}"
                fstype: xfs
                state: mounted

        - name: Verifica che il disco dati sia montato
          ansible.builtin.command: mountpoint -q {{ data_disk_path }}
          changed_when: false

        - name: Controlla se /var/lib/rancher e' gia' un bind mount
          ansible.builtin.command: mountpoint -q /var/lib/rancher
          register: rancher_mounted
          changed_when: false
          failed_when: false

        - name: Controlla se RKE2 ha gia' dati sul disco di sistema
          ansible.builtin.stat:
            path: /var/lib/rancher/rke2/server
          register: rancher_on_root

        - name: Blocca se RKE2 e' gia' installato sul disco di sistema
          ansible.builtin.fail:
            msg: >-
              /var/lib/rancher contiene gia' un cluster RKE2 sul disco di
              sistema: montare il bind ora lo nasconderebbe. Disinstalla RKE2
              (rke2-uninstall.sh) o svuota la cartella, poi rilancia.
          when: rancher_mounted.rc != 0 and rancher_on_root.stat.exists

        - name: Crea le cartelle sul disco dati e i punti di mount
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - "{{ data_disk_path }}/rancher"
            - "{{ data_disk_path }}/kubelet"
            - "{{ data_disk_path }}/longhorn"
            - /var/lib/rancher
            - /var/lib/kubelet

        - name: Monta in bind /var/lib/rancher e /var/lib/kubelet dal disco dati
          ansible.posix.mount:
            path: "{{ item.dest }}"
            src: "{{ item.src }}"
            fstype: none
            opts: bind
            state: mounted
          loop:
            - { src: "{{ data_disk_path }}/rancher", dest: /var/lib/rancher }
            - { src: "{{ data_disk_path }}/kubelet", dest: /var/lib/kubelet }

        - name: Sistema le etichette SELinux sui punti di mount
          ansible.builtin.command: restorecon -R /var/lib/rancher /var/lib/kubelet
          changed_when: false
          failed_when: false
